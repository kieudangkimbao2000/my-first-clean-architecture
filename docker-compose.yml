services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: cleanarch
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: cleanarch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  postgres_data:
    driver: local